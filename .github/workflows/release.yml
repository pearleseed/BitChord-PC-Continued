name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
          - os: ubuntu-24.04
            arch: x86_64
          - os: windows-latest
            arch: x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - name: Read the version from Cargo
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version=$(cargo +stable metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            echo "Tag $REF_NAME must match Cargo version $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev
      - name: Test
        run: cargo +stable test --locked
      - name: Build
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          if [[ -z "$LASTFM_API_KEY" || -z "$LASTFM_SECRET" ]]; then
            echo "::warning::This release build will show Last.fm as unconfigured."
          fi
          cargo +stable build --release --locked
      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          macos/bundle.sh target/release/bitchord "$VERSION" installed
          macos/bundle.sh target/release/bitchord "$VERSION" portable portable
          hdiutil create -quiet -fs HFS+ -volname BitChord -srcfolder installed "dist/bitchord-setup-$VERSION-macos-$ARCH.dmg"
          ditto -c -k --keepParent portable/bitchord.app "dist/bitchord-portable-$VERSION-macos-$ARCH.zip"
      - name: Package Linux
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist bitchord
          cp target/release/bitchord linux/install.sh linux/bitchord.desktop README.md LICENSE bitchord/
          cp assets/icon/icon.png bitchord/bitchord.png
          tar -czf "dist/bitchord-$VERSION-linux-$ARCH.tar.gz" bitchord
          cp linux/portable.txt bitchord/
          tar -czf "dist/bitchord-portable-$VERSION-linux-$ARCH.tar.gz" bitchord
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" installer/bitchord.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory dist, portable
          Copy-Item installer/Output/*.exe dist/
          Copy-Item target/release/bitchord.exe, installer/portable.txt, README.md, LICENSE portable/
          Compress-Archive -Path portable/* -DestinationPath "dist/bitchord-portable-$env:VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: dist/*
          if-no-files-found: error

  draft:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BitChord ${{ github.ref_name }}
          draft: true
          files: dist/*
          fail_on_unmatched_files: true
