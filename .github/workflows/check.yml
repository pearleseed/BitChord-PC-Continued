name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable --no-self-update
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev
      - name: Unit tests
        run: cargo +stable test --locked
      - name: Build desktop app
        run: cargo +stable build --locked
  jam:
    name: Jam Worker and smoke client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and Wasm target
        run: |
          rustup update stable --no-self-update
          rustup target add --toolchain stable wasm32-unknown-unknown
      - run: cargo +stable build --locked --manifest-path server/Cargo.toml --target wasm32-unknown-unknown
      - run: cargo +stable build --locked --manifest-path server/smoke/Cargo.toml
